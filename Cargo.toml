[workspace]
resolver = "2"
members = [
    "crates/yalr",
    "crates/providers",
    "crates/ingest",
    "crates/dashboard",
    "crates/common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros", "json"] }
clickhouse = { version = "0.13", default-features = false, features = ["rustls-tls", "uuid", "chrono", "inserter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"
rand = { version = "0.8" }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
base64 = "0.22"
include_dir = "0.7"
once_cell = "1"
bytes = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
